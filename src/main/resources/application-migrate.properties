# Execute once per deployment with owner credentials; never start a web server.
spring.main.web-application-type=none
spring.datasource.url=${MIGRATION_DATASOURCE_URL}
spring.datasource.username=${MIGRATION_DATASOURCE_USERNAME}
spring.datasource.password=${MIGRATION_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
app.rls.enabled=false
spring.data.jpa.repositories.enabled=false
