<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<!-- ======================================================
  1. DOCUMENT HEAD
====================================================== -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Pete’s Pizza — Home</title>

    <!-- ==================================================
      2. GLOBAL STYLES
    ================================================== -->
    <style>

        /* 2.1 BODY */
        body {
            font-family: Arial, sans-serif;
            background-color: var(--color-page);
            color: var(--color-text);
            margin: 0;
        }

        /* ==================================================
          3. HEADER STYLES
        ================================================== */
        header {
            background-color: var(--color-blue);
            color: var(--color-surface);
            padding: 20px;
            text-align: center;
            position: relative;
        }

        /* 3.1 HEADER TEXT */
        header h1 {
            font-size: 3em;
            margin: 0;
        }

        header p {
            margin-top: 5px;
            font-size: 1.2em;
        }

        /* 3.2 PROFILE CONTAINER (TOP RIGHT) */
        .profile-container {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .username {
            font-weight: bold;
        }

        .view-profile-btn {
            background-color: var(--color-red);
            color: var(--color-surface);
            padding: 8px 15px;
            border-radius: 15px;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .view-profile-btn:hover {
            background-color: var(--color-surface);
            color: var(--color-red);
            border: 2px solid var(--color-red-soft);
        }

        /* ==================================================
          4. LOGGED-IN GREETING BAR
        ================================================== */
        #logged-in {
            background-color: var(--color-blue-tint);
            color: var(--color-blue-dark);
            text-align: center;
            padding: 10px;
            font-weight: bold;
        }

        /* ==================================================
          5. NAVIGATION
        ================================================== */
        nav {
            display: flex;
            justify-content: center;
            margin: 25px 0;
        }

        /* 5.1 NAV LINKS */
        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a,
        .nav-links button {
            width: 150px;
            height: 50px;
            box-sizing: border-box;
            border: 2px solid var(--color-blue);
            border-radius: 15px;
            background-color: transparent;
            color: var(--color-blue);
            font-family: inherit;
            font-weight: bold;
            font-size: 1em;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .nav-links a {
            flex: 0 0 150px;
        }

        .nav-links form {
            width: 150px;
            height: 50px;
            flex: 0 0 150px;
            margin: 0;
        }

        .nav-links button {
            cursor: pointer;
        }

        .nav-links a:hover,
        .nav-links button:hover {
            background-color: var(--color-blue);
            color: var(--color-surface);
        }

        /* ==================================================
          6. LOCATIONS SECTION
        ================================================== */
        #locations {
            display: flex;
            gap: 20px;
            padding: 0 20px 40px;
            flex-wrap: wrap;
            align-items: stretch;
        }

        /* 6.1 LOCATION CARD */
        .map-container {
            flex: 1 1 0;
            min-width: 300px;
            background: var(--color-surface);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(var(--color-text-rgb),0.1);
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
        }

        .map-container:hover {
            transform: scale(1.03);
        }

        .map-container h3 {
            color: var(--color-blue);
            margin-bottom: 15px;
        }

        /* 6.2 VIEW MENU BUTTON */
        .view-menu-btn {
            width: 150px;
            height: 50px;
            margin: 0 auto 15px;
            display: flex;
            align-self: center;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--color-blue);
            border-radius: 15px;
            color: var(--color-blue);
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s;
        }

        .view-menu-btn:hover {
            background-color: var(--color-blue);
            color: var(--color-surface);
            transform: scale(1.05);
        }

        /* 6.3 EMBEDDED MAP */
        .map-container iframe {
            width: 100%;
            height: 450px;
            border: 0;
            border-radius: 10px;
            display: block;
        }

        @media (max-width: 700px) {
            header { padding: 16px; }
            header h1 { font-size: 1.8rem; }
            header p { font-size: 1rem; }
            .profile-container {
                position: static;
                justify-content: center;
                flex-wrap: wrap;
                margin-top: 12px;
            }
            nav { margin: 12px; }
            .nav-links { width: 100%; gap: 8px; flex-wrap: wrap; }
            .nav-links a,
            .nav-links form { flex: 1 1 135px; width: auto; min-width: 0; }
            .nav-links button { width: 100%; }
            #locations { padding: 0 12px 24px; gap: 12px; }
            .map-container { min-width: 0; flex-basis: 100%; padding: 16px; border-radius: 8px; }
            .map-container iframe { height: 300px; }
        }

    </style>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>

<body>

<!-- ======================================================
  7. HEADER CONTENT
====================================================== -->
<header>
    <h1>Pete’s Pizza</h1>
    <p>Kenridge & Uitzicht Branch</p>

    <!-- 7.1 PROFILE (AUTHENTICATED USERS ONLY) -->
    <div class="profile-container">
        <sec:authorize access="isAuthenticated()">
            <span class="username" th:text="${customerName}">User</span>
            <a th:href="@{/profile/edit}" class="view-profile-btn">View Profile</a>
        </sec:authorize>
    </div>
</header>

<!-- ======================================================
  8. LOGGED-IN GREETING (AUTH ONLY)
====================================================== -->
<sec:authorize access="isAuthenticated()">
    <div id="logged-in">
        Hello <span th:text="${customerName}">User</span>
    </div>
</sec:authorize>

<!-- ======================================================
  9. NAVIGATION
====================================================== -->
<nav>
    <div class="nav-links">

        <!-- 9.1 COMMON LINK -->
        <a href="/order" class="nav-btn--order">Order Online</a>

        <!-- 9.2 GUEST LINKS -->
        <th:block sec:authorize="isAnonymous()">
            <a href="/login">Login</a>
            <a href="/register">Sign Up</a>
        </th:block>

        <!-- 9.3 LOGOUT -->
        <th:block sec:authorize="isAuthenticated()">
            <form id="logout-form" th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="nav-btn--logout">Logout</button>
            </form>
        </th:block>

    </div>
</nav>

<!-- ======================================================
 10. LOCATIONS
====================================================== -->
<section id="locations">

    <!-- 10.1 KENRIDGE -->
    <div class="map-container">
        <h3>Kenridge</h3>
        <a href="/menu/kenridge" class="view-menu-btn">View Menu</a>
        <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d111816.69185531799!2d18.481253497265616!3d-33.86164439999998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1dcc50b334113f2d%3A0xdd90d0541901f562!2sPete&#39;s%20Pizza&#39;s%20-%20Kenridge!5e1!3m2!1sen!2sza!4v1781728376734!5m2!1sen!2sza"
                allowfullscreen
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </div>

    <!-- 10.2 UITZICHT -->
    <div class="map-container">
        <h3>Uitzicht</h3>
        <a href="/menu/uitzicht" class="view-menu-btn">View Menu</a>
        <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d53020.54630933175!2d18.646045413647034!3d-33.84367690902686!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1dcc568e9ccd0cb5%3A0x62daf552123b8e9!2sPete%27s%20Pizza%20Uitzicht!5e0!3m2!1sen!2sza!4v1769270688975!5m2!1sen!2sza"
                allowfullscreen
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </div>

</section>

</body>
</html>
