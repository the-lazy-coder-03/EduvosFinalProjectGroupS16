<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/password-recovery.css}">
    <title>Create a new password | Pete's Pizza</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="recovery-page">
<main class="recovery-shell">
    <header class="recovery-brand" aria-label="Pete's Pizza">
        <span class="recovery-brand-mark" aria-hidden="true">P</span>
        <p class="recovery-brand-name">Pete's Pizza</p>
    </header>

    <section class="recovery-panel" aria-labelledby="recovery-title">
        <p class="recovery-eyebrow">Account recovery</p>
        <h1 class="recovery-title" id="recovery-title">Create a new password</h1>
        <p class="recovery-intro">Choose a strong password for your Pete's Pizza account.</p>

        <div th:if="${error}" class="recovery-status recovery-status-error" role="alert" th:text="${error}"></div>

        <form class="recovery-form" th:action="@{/reset-password}" method="post" id="resetPasswordForm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="token" th:value="${token}">

            <div class="recovery-field">
                <label for="password">New password</label>
                <div class="recovery-input-wrap">
                    <input class="recovery-input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required autofocus aria-describedby="passwordRequirements">
                    <button class="recovery-toggle" type="button" data-password-toggle="password" aria-controls="password" aria-label="Show new password">Show</button>
                </div>
            </div>

            <div class="recovery-requirements" id="passwordRequirements" aria-live="polite">
                <p class="recovery-requirements-title">Your password must include:</p>
                <ul>
                    <li data-password-rule="length">At least 8 characters</li>
                    <li data-password-rule="uppercase">One uppercase letter</li>
                    <li data-password-rule="lowercase">One lowercase letter</li>
                    <li data-password-rule="number">One number</li>
                </ul>
            </div>

            <div class="recovery-field">
                <label for="confirmPassword">Confirm new password</label>
                <div class="recovery-input-wrap">
                    <input class="recovery-input" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
                    <button class="recovery-toggle" type="button" data-password-toggle="confirmPassword" aria-controls="confirmPassword" aria-label="Show password confirmation">Show</button>
                </div>
                <p class="recovery-hint" id="passwordMatchHint" aria-live="polite"></p>
            </div>

            <button class="recovery-primary" type="submit">Reset password</button>
        </form>

        <p class="recovery-link-row"><a class="recovery-link" th:href="@{/login}">Back to login</a></p>
    </section>
</main>
<script th:attr="nonce=${cspNonce}">
    (() => {
        const password = document.getElementById("password");
        const confirmation = document.getElementById("confirmPassword");
        const matchHint = document.getElementById("passwordMatchHint");

        const rules = {
            length: value => value.length >= 8,
            uppercase: value => /[A-Z]/.test(value),
            lowercase: value => /[a-z]/.test(value),
            number: value => /\d/.test(value)
        };

        function updateRequirements() {
            const value = password.value;
            Object.entries(rules).forEach(([name, test]) => {
                const item = document.querySelector(`[data-password-rule="${name}"]`);
                if (item) item.classList.toggle("is-met", test(value));
            });
        }

        function updateMatchHint() {
            if (!confirmation.value) {
                matchHint.textContent = "";
                return;
            }
            matchHint.textContent = password.value === confirmation.value
                ? "Passwords match."
                : "Passwords do not match yet.";
            matchHint.style.color = password.value === confirmation.value ? "var(--color-success)" : "var(--color-error)";
        }

        password.addEventListener("input", () => {
            updateRequirements();
            updateMatchHint();
        });
        confirmation.addEventListener("input", updateMatchHint);

        document.querySelectorAll("[data-password-toggle]").forEach(toggle => {
            toggle.addEventListener("click", () => {
                const input = document.getElementById(toggle.dataset.passwordToggle);
                const showing = input.type === "text";
                input.type = showing ? "password" : "text";
                toggle.textContent = showing ? "Show" : "Hide";
                toggle.setAttribute("aria-label", `${showing ? "Show" : "Hide"} ${input.id === "password" ? "new password" : "password confirmation"}`);
            });
        });
    })();
</script>
</body>
</html>
