<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pete's Pizza | Admin Login</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--color-page);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-container {
            text-align: center;
            width: 100%;
        }

        .brand {
            margin-bottom: 20px;
        }

        .brand h1 {
            font-size: 3em;
            color: var(--color-blue);
        }

        .brand p {
            color: var(--color-muted);
            font-size: 1.1em;
        }

        .login-container {
            background: var(--color-surface);
            padding: 40px 30px;
            width: min(380px, 100%);
            margin-inline: auto;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(var(--color-text-rgb),0.1);
        }

        .login-container h2 {
            color: var(--color-blue);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            height: 45px;
            padding: 0 15px;
            border-radius: 15px;
            border: 2px solid var(--color-muted);
            font-size: 16px;
            background-color: var(--color-surface);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-blue-dark);
            background-color: var(--color-page);
        }

        .password-field { position: relative; }
        .password-field input { padding-right: 78px; }
        .password-toggle {
            position: absolute;
            top: 2px;
            right: 2px;
            min-width: 68px;
            height: 41px;
            border: 0;
            border-radius: 0 12px 12px 0;
            background: transparent;
            color: var(--color-blue);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .password-toggle:focus-visible { outline: 2px solid var(--color-blue-dark); outline-offset: -4px; }

        .login-btn {
            width: 100%;
            height: 50px;
            background-color: var(--color-blue);
            color: var(--color-surface);
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.1em;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: var(--color-surface);
            color: var(--color-blue);
            border: 2px solid var(--color-blue-soft);
        }

        .error {
            color: var(--color-error);
            font-size: 0.95em;
            margin-top: 10px;
            text-align: center;
        }

        .extra-links {
            margin-top: 20px;
            text-align: center;
        }

        .extra-links a {
            color: var(--color-blue);
            text-decoration: none;
            font-weight: bold;
        }

        .extra-links a:hover {
            text-decoration: underline;
            color: var(--color-blue-dark);
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>

<body>
<div class="page-container">
    <div class="brand">
        <h1>Pete's Pizza</h1>
        <p>Admin Panel</p>
    </div>

    <div class="login-container">
        <h2>Admin Login</h2>

        <form th:action="@{/login}" method="post" data-login-form>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="adminLogin" value="true">

            <div class="form-group">
                <label for="username">Admin Username</label>
                <input type="text" id="username" name="username" placeholder="Enter admin username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Admin Password</label>
                <div class="password-field">
                    <input type="password" id="password" name="password" required autocomplete="current-password" data-password-input>
                    <button type="button" class="password-toggle" data-password-toggle aria-label="Show password" aria-controls="password" aria-pressed="false">Show</button>
                </div>
            </div>

            <button type="submit" class="login-btn" data-submitting-text="Signing in...">Login to Admin Panel</button>

            <div th:if="${param.error}" class="error">Invalid admin username or password</div>
        </form>

        <div class="extra-links">
            <p><a th:href="@{/login}">User login</a></p>
            <p><a th:href="@{/}">Back to home</a></p>
        </div>
    </div>
</div>
<script th:src="@{/js/login-submit.js}" defer></script>
</body>
</html>
